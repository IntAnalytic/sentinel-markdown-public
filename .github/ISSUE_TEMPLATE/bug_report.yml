name: Bug report
description: Something is broken or renders wrong
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report this. A small Markdown snippet that reproduces the
        problem is the single most useful thing you can include.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
      placeholder: Opened a document with a Mermaid diagram and it rendered as a code block…
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Markdown that reproduces it (if rendering-related)
      description: Paste the smallest snippet that shows the problem. It will be formatted as code automatically.
      render: markdown
    validations:
      required: false
  - type: input
    id: version
    attributes:
      label: App version
      description: Help → About, or the Settings panel.
      placeholder: "1.3.3"
    validations:
      required: true
  - type: dropdown
    id: install-channel
    attributes:
      label: How did you install?
      options:
        - Microsoft Store
        - MSI installer
        - NSIS installer (setup .exe)
        - Standalone .exe
        - Built from source
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Windows version
      placeholder: "Windows 11 Pro 24H2"
    validations:
      required: false
  - type: dropdown
    id: area
    attributes:
      label: Where does it show up?
      options:
        - Main app window
        - Explorer Preview Pane
        - Exported HTML
        - Installation / file association
        - Other
    validations:
      required: false
